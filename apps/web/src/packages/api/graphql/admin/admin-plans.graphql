# Admin Plans Management GraphQL Operations

# Query all plans with optional filters
query GetAdminPlans(
  $isActive: Boolean
  $search: String
) {
  adminPlans(filters: { isActive: $isActive, search: $search }) {
    id
    name
    slug
    description
    isActive
    maxActiveProjects
    maxMembers
    storageGB
    isPopular
    sortOrder
    isEarlyBird
    trialDays
    features {
      id
      name
      description
      isIncluded
      sortOrder
    }
    prices {
      id
      currency
      price
      earlyBirdPrice
      billingCycleDays
    }
    subscriptionsCount
    createdAt
    updatedAt
  }
}

# Query paginated plans
query GetAdminPlansPaginated(
  $isActive: Boolean
  $search: String
  $currency: String
  $pagination: PaginationInput!
) {
  adminPlansPaginated(
    filters: {
      isActive: $isActive
      search: $search
      currency: $currency
    }
    pagination: $pagination
  ) {
    nodes {
      id
      name
      slug
      description
      isActive
      maxActiveProjects
      maxMembers
      storageGB
      isPopular
      sortOrder
      isEarlyBird
      trialDays
      features {
        id
        name
        description
        isIncluded
        sortOrder
      }
      prices {
        id
        currency
        price
        earlyBirdPrice
        billingCycleDays
      }
      subscriptionsCount
      createdAt
      updatedAt
    }
    totalCount
    pageInfo {
      currentPage
      totalPages
      hasNextPage
      hasPreviousPage
    }
  }
}

