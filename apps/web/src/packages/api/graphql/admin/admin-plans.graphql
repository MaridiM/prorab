# Create a new plan
mutation CreateAdminPlan($input: AdminCreatePlanInput!) {
  adminCreatePlan(input: $input) {
    id
    name
    slug
    description
    isActive
    maxActiveProjects
    maxMembers
    storageGB
    isPopular
    sortOrder
    isEarlyBird
    trialDays
    features {
      id
      name
      description
      isIncluded
      sortOrder
    }
    prices {
      id
      currency
      price
      earlyBirdPrice
      billingCycleDays
    }
    createdAt
    updatedAt
  }
}

# Update an existing plan
mutation UpdateAdminPlan($id: String!, $input: AdminUpdatePlanInput!) {
  adminUpdatePlan(id: $id, input: $input) {
    id
    name
    slug
    description
    isActive
    maxActiveProjects
    maxMembers
    storageGB
    isPopular
    sortOrder
    isEarlyBird
    trialDays
    features {
      id
      name
      description
      isIncluded
      sortOrder
    }
    prices {
      id
      currency
      price
      earlyBirdPrice
      billingCycleDays
    }
    updatedAt
  }
}

# Archive a plan
mutation ArchiveAdminPlan($id: String!) {
  adminArchivePlan(id: $id) {
    id
    isActive
    updatedAt
  }
}

# Activate a plan
mutation ActivateAdminPlan($id: String!) {
  adminActivatePlan(id: $id) {
    id
    isActive
    updatedAt
  }
}

# Delete a plan
mutation DeleteAdminPlan($id: String!) {
  adminDeletePlan(id: $id)
}
