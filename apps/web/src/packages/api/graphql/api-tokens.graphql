# API Tokens

query MyApiTokens {
  myApiTokens {
    id
    name
    tokenPrefix
    lastUsedAt
    lastUsedIp
    createdAt
    expiresAt
    isExpired
  }
}

mutation GenerateApiToken($input: GenerateTokenInput!) {
  generateApiToken(input: $input) {
    id
    name
    token
    tokenPrefix
    createdAt
    expiresAt
  }
}

mutation RevokeApiToken($tokenId: String!) {
  revokeApiToken(tokenId: $tokenId)
}
