# ==================== Auth Mutations ====================

mutation Register($input: RegisterInput!) {
  register(input: $input) {
    user {
      id
      email
      fullName
      phone
      emailVerified
      hasCompletedOnboarding
      businessRole
      businessRoleAssignedAt
    }
    message
  }
}

mutation Login($input: LoginInput!) {
  login(input: $input) {
    user {
      id
      email
      fullName
      phone
      emailVerified
      hasCompletedOnboarding
      businessRole
      businessRoleAssignedAt
    }
    requiresTwoFactor
    twoFactorToken
  }
}

mutation VerifyTwoFactorLogin($twoFactorToken: String!, $code: String!) {
  verifyTwoFactorLogin(twoFactorToken: $twoFactorToken, code: $code) {
    user {
      id
      email
      fullName
      phone
      emailVerified
      hasCompletedOnboarding
      businessRole
      businessRoleAssignedAt
    }
  }
}

mutation Logout {
  logout
}

mutation RefreshSession {
  refreshSession {
    user {
      id
      email
      fullName
      phone
      emailVerified
      hasCompletedOnboarding
      businessRole
      businessRoleAssignedAt
    }
  }
}

mutation VerifyEmail($token: String!) {
  verifyEmail(token: $token)
}

mutation ResendVerificationEmail {
  resendVerificationEmail
}

mutation ForgotPassword($email: String!) {
  forgotPassword(email: $email)
}

mutation ResetPassword($input: ResetPasswordInput!) {
  resetPassword(input: $input)
}

mutation ChangePassword($input: ChangePasswordInput!) {
  changePassword(input: $input)
}

mutation InitiateEmailChange($input: ChangeEmailInput!) {
  initiateEmailChange(input: $input) {
    success
    pendingVerification
    message
  }
}

mutation VerifyEmailChange($input: VerifyEmailChangeInput!) {
  verifyEmailChange(input: $input)
}

mutation UpdateProfile($input: UpdateProfileInput!) {
  updateProfile(input: $input) {
    id
    email
    fullName
    phone
  }
}

mutation UpdateNotificationSettings($input: UpdateNotificationSettingsInput!) {
  updateNotificationSettings(input: $input) {
    id
    appPush
    appEmail
    appSms
    marketingPush
    marketingEmail
    notifyProjectCreated
    notifyProjectCompleted
    notifyExpenseAdded
    notifyPayoutCalculated
    notifyPayoutPaid
    notifyMemberInvited
    notifyMemberJoined
    notifyMemberRemoved
    notifyTaskAssigned
    notifyTaskCompleted
    notifyPhotoReportCreated
    notifySubscriptionExpiring
    emailFrequency
    pushFrequency
    quietHoursEnabled
    quietHoursStart
    quietHoursEnd
  }
}

# ==================== Session Mutations ====================

mutation RevokeSession($sessionId: String!) {
  revokeSession(sessionId: $sessionId)
}

mutation RevokeAllSessions {
  revokeAllSessions
}

mutation RevokeAllSessionsIncludingCurrent {
  revokeAllSessionsIncludingCurrent
}

# ==================== Telegram OAuth ====================

mutation InitTelegramAuth {
  initTelegramAuth {
    token
    deepLink
    expiresAt
  }
}

mutation CheckTelegramAuth($input: CheckTelegramAuthInput!) {
  checkTelegramAuth(input: $input) {
    completed
    user {
      id
      email
      fullName
      phone
      emailVerified
      hasCompletedOnboarding
      businessRole
      businessRoleAssignedAt
    }
    sessionToken
    refreshToken
  }
}

mutation LinkTelegramAccount($token: String!) {
  linkTelegramAccount(token: $token)
}

mutation CheckTelegramLinkStatus($input: CheckTelegramAuthInput!) {
  checkTelegramLinkStatus(input: $input) {
    completed
  }
}

# ==================== Queries ====================

query Me {
  me {
    id
    email
    fullName
    phone
    avatarUrl
    emailVerified
    hasCompletedOnboarding
    businessRole
    businessRoleAssignedAt
    telegramChatId
    telegramUsername
    createdAt
    notificationSettings {
      id
      appPush
      appEmail
      appSms
      marketingPush
      marketingEmail
      notifyProjectCreated
      notifyProjectCompleted
      notifyExpenseAdded
      notifyPayoutCalculated
      notifyPayoutPaid
      notifyMemberInvited
      notifyMemberJoined
      notifyMemberRemoved
      notifyTaskAssigned
      notifyTaskCompleted
      notifyPhotoReportCreated
      notifySubscriptionExpiring
      emailFrequency
      pushFrequency
      quietHoursEnabled
      quietHoursStart
      quietHoursEnd
    }
    adminRole {
      id
      role
      permissions
    }
  }
}

mutation SendTestTelegramNotification {
  sendTestTelegramNotification
}

query Sessions {
  sessions {
    id
    userAgent
    ip
    city
    country
    device
    browser
    os
    createdAt
    current
  }
}

query LoginHistory {
  loginHistory {
    id
    ip
    userAgent
    city
    country
    device
    browser
    os
    createdAt
  }
}

