# ============ FRAGMENTS ============

fragment SubscriptionFields on Subscription {
  id
  teamId
  plan
  planId
  status
  currentPeriodStart
  currentPeriodEnd
  trialEndsAt
  cancelAtPeriodEnd
  cancelledAt
  isEarlyBird
  planRef {
    id
    name
    trialDays
  }
  limits {
    name
    price
    maxActiveProjects
    maxMembers
    storageGB
    features
  }
  createdAt
  updatedAt
}

fragment PlanLimitsFields on PlanLimits {
  id
  slug
  name
  price
  maxActiveProjects
  maxMembers
  storageGB
  features
}

fragment PaymentFields on Payment {
  id
  subscriptionId
  teamId
  amount
  currency
  status
  yookassaPaymentId
  paymentMethod
  description
  failureReason
  paidAt
  refundedAt
  createdAt
  updatedAt
}

fragment PlanPriceFields on AdminPlanPriceModel {
  id
  planId
  currency
  price
  earlyBirdPrice
  billingCycleDays
  createdAt
  updatedAt
}

fragment PlanFeatureFields on AdminPlanFeatureModel {
  id
  planId
  name
  description
  isIncluded
  sortOrder
}

fragment AdminPlanFields on AdminPlanModel {
  id
  slug
  name
  description
  maxActiveProjects
  maxMembers
  storageGB
  isActive
  isPopular
  sortOrder
  isEarlyBird
  trialDays
  prices {
    ...PlanPriceFields
  }
  features {
    ...PlanFeatureFields
  }
  subscriptionsCount
  createdAt
  updatedAt
}

# ============ QUERIES ============

query MySubscription {
  mySubscription {
    ...SubscriptionFields
  }
}

query MySubscriptionHistory {
  mySubscriptionHistory {
    ...SubscriptionFields
  }
}

query GetSubscription($id: String!) {
  subscription(id: $id) {
    ...SubscriptionFields
  }
}

query CurrentPlanLimits($teamId: String!) {
  currentPlanLimits(teamId: $teamId) {
    ...PlanLimitsFields
  }
}

query UsageStats($teamId: String!) {
  usageStats(teamId: $teamId) {
    activeProjects
    totalMembers
    storageUsedGB
    limits {
      ...PlanLimitsFields
    }
  }
}

query CanAddProject($teamId: String!) {
  canAddProject(teamId: $teamId)
}

query PaymentsBySubscription($subscriptionId: String!) {
  paymentsBySubscription(subscriptionId: $subscriptionId) {
    ...PaymentFields
  }
}

query AvailablePlans {
  availablePlans {
    ...AdminPlanFields
  }
}

query AvailablePlansDetailed {
  availablePlansDetailed {
    ...AdminPlanFields
  }
}

query PlanBySlug($slug: String!) {
  planBySlug(slug: $slug) {
    ...AdminPlanFields
  }
}

# ============ MUTATIONS ============

mutation CreateSubscription($input: CreateSubscriptionInput!) {
  createSubscription(input: $input) {
    ...SubscriptionFields
  }
}

mutation ChangePlan($input: ChangePlanInput!) {
  changePlan(input: $input) {
    ...SubscriptionFields
  }
}

mutation CancelSubscription($subscriptionId: String!) {
  cancelSubscription(subscriptionId: $subscriptionId) {
    ...SubscriptionFields
  }
}

mutation ReactivateSubscription($subscriptionId: String!) {
  reactivateSubscription(subscriptionId: $subscriptionId) {
    ...SubscriptionFields
  }
}

fragment PaymentProviderFields on PaymentProviderModel {
  id
  type
  name
  isActive
  isPrimary
}

query AvailablePaymentProviders {
  availablePaymentProviders {
    ...PaymentProviderFields
  }
}

mutation InitializePayment($subscriptionId: String!, $providerType: String) {
  initializePayment(subscriptionId: $subscriptionId, providerType: $providerType) {
    url
    paymentId
  }
}
