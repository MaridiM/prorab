# ==================== TYPES ====================
# Note: Most types are defined in schema.gql generated from backend
# This file only includes client-specific queries and mutations

# ==================== QUERIES ====================

query MyTeams {
  myTeams {
    id
    name
    logoType
    logoUrl
    iconId
    colorId
    ownerId
    createdAt
    updatedAt
    subscription {
      plan
    }
  }
}

query Team($id: ID!) {
  team(id: $id) {
    id
    name
    logoType
    logoUrl
    iconId
    colorId
    ownerId
    createdAt
    updatedAt
  }
}

query TeamMembers($teamId: ID!) {
  teamMembers(teamId: $teamId) {
    id
    teamId
    userId
    role
    position
    salaryType
    salaryAmount
    joinedAt
    user {
      id
      email
      fullName
      phone
      avatarUrl
    }
    stats {
      projectCount
      totalPayouts
      averagePayoutPerProject
      completedPayoutsCount
      pendingPayoutsCount
    }
  }
}

query TeamStats($teamId: ID!) {
  teamStats(teamId: $teamId) {
    totalExpenses
    totalBudget
    profit
    activeProjectsCount
    membersCount
    totalHours
  }
}

# ==================== MUTATIONS ====================

mutation CompleteOnboarding(
  $input: CompleteOnboardingInput!
) {
  completeOnboarding(input: $input) {
    success
    message
    team {
      id
      name
      logoType
      logoUrl
      iconId
      colorId
      createdAt
    }
    project {
      id
      name
      address
      description
      status
      progress
      createdAt
    }
    paymentUrl
  }
}

mutation UpdateTeam($input: UpdateTeamInput!) {
  updateTeam(input: $input) {
    id
    name
    logoType
    logoUrl
    iconId
    colorId
    updatedAt
  }
}

mutation RemoveTeamMember($teamId: ID!, $memberId: ID!) {
  removeTeamMember(teamId: $teamId, memberId: $memberId)
}

mutation CreateInviteLink($teamId: ID!, $expiresInDays: Int) {
  createInviteLink(teamId: $teamId, expiresInDays: $expiresInDays) {
    id
    teamId
    code
    expiresAt
    usedBy
    usedAt
    createdAt
    isActive
    inviteUrl
  }
}

mutation SendInviteByEmail($input: SendInviteByEmailInput!) {
  sendInviteByEmail(input: $input) {
    inviteCode {
      id
      teamId
      code
      expiresAt
      usedBy
      usedAt
      createdAt
      isActive
      inviteUrl
    }
    emailSent
  }
}

mutation JoinTeamByInvite($code: String!) {
  joinTeamByInvite(code: $code) {
    id
    teamId
    userId
    role
    joinedAt
    team {
      id
      name
      logoType
      logoUrl
      iconId
      colorId
    }
  }
}

query TeamInvites($teamId: ID!) {
  teamInvites(teamId: $teamId) {
    id
    teamId
    code
    expiresAt
    usedBy
    usedAt
    createdAt
    isActive
    inviteUrl
  }
}

mutation DeleteInviteCode($codeId: ID!) {
  deleteInviteCode(codeId: $codeId)
}

mutation UpdateMemberPosition($input: UpdateMemberPositionInput!) {
  updateMemberPosition(input: $input) {
    id
    teamId
    userId
    role
    position
    joinedAt
  }
}

query MemberSalaryHistory($memberId: ID!) {
  memberSalaryHistory(memberId: $memberId) {
    id
    memberId
    previousType
    previousAmount
    newType
    newAmount
    reason
    changedByUserId
    createdAt
    changedBy {
      id
      fullName
      email
    }
  }
}
