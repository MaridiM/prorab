# ==================== TYPES ====================
# Note: Most types are defined in schema.gql generated from backend
# This file only includes client-specific queries and mutations

# ==================== QUERIES ====================

query MyTeams {
  myTeams {
    id
    name
    logoType
    logoUrl
    iconId
    colorId
    ownerId
    createdAt
    updatedAt
  }
}

query Team($id: ID!) {
  team(id: $id) {
    id
    name
    logoType
    logoUrl
    iconId
    colorId
    ownerId
    createdAt
    updatedAt
  }
}

query TeamMembers($teamId: ID!) {
  teamMembers(teamId: $teamId) {
    id
    teamId
    userId
    role
    salaryType
    salaryAmount
    joinedAt
    user {
      id
      email
      fullName
      phone
    }
  }
}

# ==================== MUTATIONS ====================

mutation CompleteOnboarding(
  $input: CompleteOnboardingInput!
) {
  completeOnboarding(input: $input) {
    success
    message
    team {
      id
      name
      logoType
      logoUrl
      iconId
      colorId
      createdAt
    }
    project {
      id
      name
      address
      description
      status
      progress
      createdAt
    }
  }
}

mutation UpdateTeam($input: UpdateTeamInput!) {
  updateTeam(input: $input) {
    id
    name
    logoType
    logoUrl
    iconId
    colorId
    updatedAt
  }
}

mutation RemoveTeamMember($teamId: ID!, $memberId: ID!) {
  removeTeamMember(teamId: $teamId, memberId: $memberId)
}
